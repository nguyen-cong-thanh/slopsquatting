description = """
Hỏi lại model: cần những gói nào để chạy đoạn code nó vừa sinh. Chép đúng mode 1 trong
generate_package_names.py của Spracklen và cộng sự: temperature 0.01, top_k 20, top_p 0.9,
tối đa 64 token, đầu vào là câu trả lời của tác vụ sinh code (đã cắt khoảng trắng hai đầu).
"""
input = "generation"
parent_task = "spracklen_code_v1"
system = "You are a coding assistant that determines Python packages necessary to execute code. Respond with only a list of Python packages, separated by commas and no additional text or formatting. Your response must begin with the name of a Python package."
user = "Which Python packages are required to run this code: {response}"
extract = ["llm_list"]

[params]
temperature = 0.01
top_k = 20
top_p = 0.9
max_tokens = 64
