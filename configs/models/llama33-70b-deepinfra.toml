description = "Llama 3.3 70B Instruct Turbo (FP8) qua DeepInfra (đo độ bền tên bịa giữa các phiên bản Llama). Khóa API đọc từ file, không nằm trong repo."
backend = "openai_compat"
base_url = "https://api.deepinfra.com/v1/openai"
model = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
api_key_env = "DEEPINFRA_API_KEY"
api_key_file = "~/.config/deepinfra/api_key"
concurrency = 128
timeout_s = 300

[params]
# Không có chế độ suy nghĩ: không gửi tham số think.
seed_mode = "per_sample"

[extra]
think_style = "none"
send_top_k = true
send_seed = true
