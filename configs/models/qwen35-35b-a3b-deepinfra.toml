description = "Qwen3.5 35B-A3B, đo độ bền họ Qwen qua DeepInfra. Khóa API đọc từ file, không nằm trong repo."
backend = "openai_compat"
base_url = "https://api.deepinfra.com/v1/openai"
model = "Qwen/Qwen3.5-35B-A3B"
api_key_env = "DEEPINFRA_API_KEY"
api_key_file = "~/.config/deepinfra/api_key"
concurrency = 128
timeout_s = 300

[params]
seed_mode = "per_sample"
# Có chế độ suy nghĩ: tắt bằng chat_template_kwargs.enable_thinking = false (đã thử 25/11/2026: 0 token suy nghĩ).
think = false

[extra]
think_style = "chat_template_kwargs"
send_top_k = true
send_seed = true
