description = "DeepSeek V4.1 Flash (bản 1017, FP8) qua DeepInfra, chế độ không suy nghĩ. Khóa API đọc từ file, không nằm trong repo."
backend = "openai_compat"
base_url = "https://api.deepinfra.com/v1/openai"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017"
api_key_env = "DEEPINFRA_API_KEY"
api_key_file = "~/.config/deepinfra/api_key"
concurrency = 128   # DeepInfra cho tối đa 200 request đồng thời mỗi model
timeout_s = 300

[params]
seed_mode = "per_sample"

[extra]
# Đã kiểm tra 12/11/2026: với "thinking": false, reasoning_tokens = 0. DeepInfra mặc định cũng
# không suy nghĩ, nhưng vẫn gửi tường minh để cấu hình không phụ thuộc mặc định của nhà cung cấp.
think_style = "none"
send_top_k = true
send_seed = true

[extra.extra_body]
chat_template_kwargs = { thinking = false }
