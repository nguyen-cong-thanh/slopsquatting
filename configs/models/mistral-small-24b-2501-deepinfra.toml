description = "Mistral Small 24B (01/2025), đo độ bền họ Mistral qua DeepInfra. Khóa API đọc từ file, không nằm trong repo."
backend = "openai_compat"
base_url = "https://api.deepinfra.com/v1/openai"
model = "mistralai/Mistral-Small-24B-Instruct-2501"
api_key_env = "DEEPINFRA_API_KEY"
api_key_file = "~/.config/deepinfra/api_key"
concurrency = 128
timeout_s = 300

[params]
seed_mode = "per_sample"

[extra]
# Không có chế độ suy nghĩ (đã thử 25/11/2026).
think_style = "none"
send_top_k = true
send_seed = true
