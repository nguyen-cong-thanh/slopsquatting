# Chạy trên máy GLM (không cần Internet): toàn bộ câu hỏi trong data/prompts.jsonl.
# Dừng (Ctrl-C) rồi chạy lại lệnh sẽ tiếp tục từ chỗ dừng. Xong thì mang data/glm.sqlite về.
[flow]
name = "glm-generate"
db = "data/glm.sqlite"

[[steps]]
stage = "load_prompts"
source = "jsonl"
path = "data/prompts.jsonl"

[[steps]]
name = "gen-code"
stage = "generate"
model = "glm53-internal"
task = "spracklen_code_v1"
tags = ["spracklen"]

[[steps]]
name = "gen-pkgs-code"
stage = "generate"
model = "glm53-internal"
task = "spracklen_pkgs_for_code_v1"
tags = ["spracklen"]

[[steps]]
name = "gen-pkgs-prompt"
stage = "generate"
model = "glm53-internal"
task = "spracklen_pkgs_for_prompt_v1"
tags = ["spracklen"]
