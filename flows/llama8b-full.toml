# Toàn bộ 18.033 câu hỏi trên Llama 3.1 8B (DeepInfra API). Chi phí ước tính ~1 USD.
# Chạy nền: bash scripts/run_bg.sh flows/llama8b-full.toml   (dừng / chạy lại tiếp tục được)
[flow]
name = "llama8b-full"
db = "data/slop.sqlite"

[[steps]]
stage = "load_prompts"
source = "spracklen"

[[steps]]
name = "gen-code"
stage = "generate"
model = "llama31-8b-deepinfra"
task = "spracklen_code_v1"
tags = ["spracklen"]

[[steps]]
name = "gen-pkgs-code"
stage = "generate"
model = "llama31-8b-deepinfra"
task = "spracklen_pkgs_for_code_v1"
tags = ["spracklen"]

[[steps]]
name = "gen-pkgs-prompt"
stage = "generate"
model = "llama31-8b-deepinfra"
task = "spracklen_pkgs_for_prompt_v1"
tags = ["spracklen"]
